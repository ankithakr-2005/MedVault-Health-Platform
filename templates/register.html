<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedVault - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 400px;">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4">MedVault Register</h3>
            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" id="roleSelect" class="form-control" onchange="toggleDoctorField()">
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                    </select>
                </div>
                <!-- Doctor selection field (only shows if role is patient) -->
                <div class="mb-3" id="doctorField">
                    <label class="form-label">Assign Primary Doctor</label>
                    <select name="doctor_id" class="form-control">
                        <option value="">-- Select Doctor --</option>
                        {% for doc in doctors %}
                            <option value="{{ doc['id'] }}">{{ doc['name'] }} ({{ doc['email'] }})</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login">Already have an account? Login</a>
            </div>
        </div>
    </div>

    <script>
        function toggleDoctorField() {
            let role = document.getElementById('roleSelect').value;
            let docField = document.getElementById('doctorField');
            if (role === 'doctor') {
                docField.style.display = 'none';
            } else {
                docField.style.display = 'block';
            }
        }
    </script>
</body>
</html>
