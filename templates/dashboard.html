<!-- Add this inside dashboard.html under the patient reports card -->
<div class="card shadow p-4 mb-4">
    <h5 class="mb-3">Your Prescribed Medications</h5>
    {% if medications %}
        <ul class="list-group">
            {% for med in medications %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ med['medication_name'] }}</strong> ({{ med['dosage'] }})<br>
                        <small class="text-muted">Instructions: {{ med['instructions'] }}</small>
                    </div>
                    <span class="badge bg-info text-dark">Prescribed</span>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="text-muted">No medications prescribed by your doctor yet.</p>
    {% endif %}
</div>
